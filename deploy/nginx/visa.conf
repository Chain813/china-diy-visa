# 中国公民 DIY 出国签证指南 (/visa/) 独立 Nginx 子路径片段
# 部署路径：/etc/nginx/snippets/jiyan-subapps/visa.conf
# 说明：静态产物通过 `npm run build:visa` 构建至 dist/ 后，同步到 /var/www/china-diy-visa/visa/；
#       $jiyan_hsts 由宿主站点 jiyan.conf 顶部的 `map $https $jiyan_hsts` 提供（若独立迁移到其他 Nginx，请替换为固定 HSTS 值或移除该行）。

location = /visa {
    return 301 /visa/;
}

location ^~ /visa/assets/ {
    root /var/www/china-diy-visa;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security $jiyan_hsts always;
}

location ^~ /visa/ {
    root /var/www/china-diy-visa;
    index index.html;
    try_files $uri $uri/ /visa/index.html;

    if ($request_filename ~* .*\.(html|htm)$) {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security $jiyan_hsts always;
    }
}
